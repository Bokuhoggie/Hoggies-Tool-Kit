<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Kept in sync with `app.security.csp` in src-tauri/tauri.conf.json. Browsers apply
       the intersection of every CSP present, so a directive missing here is blocked even
       if Tauri allows it. `asset:` / `asset.localhost` back convertFileSrc(). -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' asset: http://asset.localhost https://asset.localhost data: blob:; media-src 'self' asset: http://asset.localhost https://asset.localhost blob:; object-src 'self' asset: http://asset.localhost https://asset.localhost; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'" />
  <title>Hoggie's Tool Kit — File & Conversion Toolkit</title>
  <meta name="description"
    content="All-in-one file conversion, video downloading, and utility toolkit. Private, fast, and offline." />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
