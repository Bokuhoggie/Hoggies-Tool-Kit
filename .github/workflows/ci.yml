name: CI

# Fast checks on every push/PR. This is what catches a change that compiles on macOS but
# breaks Windows — the failure mode that let the old platform forks drift 22 commits apart.

on:
  push:
    branches: [master, mac-rust]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `npm install`, not `npm ci`. The lock file is generated locally by npm 11.6.x,
      # which does not record the optional @emnapi WASM-fallback packages that newer npm
      # versions on the runners expect — so `npm ci` fails the in-sync check through no
      # fault of the tree. Revisit once the local and runner npm versions converge.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Required before ANY cargo command, not just a bundle: tauri-build resolves the
      # `resources` globs from tauri.conf.json inside build.rs, and fails the build script
      # outright if they match nothing. Without this, even `cargo clippy` cannot run.
      - name: Fetch ffmpeg
        run: npm run ffmpeg:fetch

      - name: Lint (JS)
        run: npm run lint

      - name: Clippy (Rust)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test

      # Type-checks the whole tree for this platform without producing an installer —
      # cheap proof that the #[cfg] branches in commands/platform.rs stay valid on both.
      - name: Check
        working-directory: src-tauri
        run: cargo check --all-targets
